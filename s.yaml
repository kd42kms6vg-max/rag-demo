edition: 3.0.0
name: rag-demo
access: default   # 由 `s config add` 配置的阿里云 AccessKey 别名

resources:
  rag-demo-fc:
    component: fc3
    props:
      region: cn-hangzhou
      functionName: rag-demo
      description: '企业制度 RAG 问答助手 (Node.js + Express + 通义千问)'
      handler: index.handler   # custom 运行时占位字段（FC 忽略，但 schema 必填）
      runtime: custom            # 自定义运行时：直接 node 启动
      cpu: 0.5
      memorySize: 256
      timeout: 60
      diskSize: 512
      instanceConcurrency: 1
      environmentVariables:
        DASHSCOPE_API_KEY: ${env.DASHSCOPE_API_KEY}   # 部署前在终端 export，切勿写死
        PORT: '9000'
      customRuntimeConfig:
        command:
          - node
          - rag-advanced.js
        port: 9000               # 必须与 PORT 环境变量一致
      code:
        src: ./
      package:
        # 打包时排除以下文件，防止 .env 里的真实 API Key 被上传到阿里云
        ignore:
          - .env
          - .git
          - .gitignore
          - '*.log'
          - server.js          # Step2 开发残留，无需部署
          - chunker.js         # Step3 开发残留
          - embeddings.js      # Step4 开发残留
          - rag.js             # Step5 开发残留
          - rag-stream.js      # Step6 开发残留
          - 演示视频脚本.md     # 交付物，不必进运行包
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          qualifier: LATEST
          triggerConfig:
            authType: anonymous   # 允许匿名访问（公网可直接打开）
            methods:
              - GET
              - POST
