<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识库问答 · RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;1,9..144,500&family=Noto+Serif+SC:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* 暖纸色 · 带品牌温度的灰，绝非纯白纯黑 */
      --paper:      oklch(97% 0.012 85);
      --surface:    oklch(93% 0.015 85);
      --ink:        oklch(27% 0.02 60);
      --ink-soft:   oklch(45% 0.018 60);
      --ink-faint:  oklch(48% 0.015 60);
      --accent:     oklch(50% 0.12 42);
      --rule:       oklch(86% 0.02 75);
      --rule-soft:  oklch(90% 0.015 75);
      --serif: "Noto Serif SC", "Songti SC", serif;
      --display: "Fraunces", "Noto Serif SC", serif;
      --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
      --measure: 64ch;
    }

    [data-theme="dark"] {
      --paper:      oklch(20% 0.012 70);
      --surface:    oklch(25% 0.015 70);
      --ink:        oklch(92% 0.01 85);
      --ink-soft:   oklch(76% 0.012 80);
      --ink-faint:  oklch(66% 0.01 80);
      --accent:     oklch(64% 0.12 42);
      --rule:       oklch(34% 0.015 75);
      --rule-soft:  oklch(30% 0.015 75);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: var(--sans);
      background: var(--paper);
      color: var(--ink);
      line-height: 1.7;
      font-size: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* 阅读栏：内容居中、限定字符宽度，像在读一份文档 */
    .shell {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: clamp(2rem, 6vw, 4.5rem) clamp(1.25rem, 5vw, 2.5rem) 9rem;
      flex: 1;
    }

    /* ── 报头 ── */
    .masthead {
      border-bottom: 1.5px solid var(--accent);
      padding-bottom: 1.5rem;
      margin-bottom: 2.5rem;
      position: relative;
    }
    .kicker {
      font-family: var(--display);
      font-style: italic;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }
    .masthead h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      line-height: 1.25;
      letter-spacing: 0.01em;
    }
    .lede {
      margin-top: 0.8rem;
      color: var(--ink-soft);
      font-size: 0.975rem;
      max-width: 52ch;
    }

    .masthead-actions {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      gap: 0.5rem;
    }
    .theme-toggle {
      font-family: var(--sans);
      font-size: 0.8rem;
      color: var(--ink-soft);
      background: none;
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 0.35rem 0.9rem;
      cursor: pointer;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }

    /* ── 对话段落 ── */
    .exchange {
      padding: 2rem 0;
      border-bottom: 1px solid var(--rule-soft);
      opacity: 0;
      transform: translateY(10px);
      animation: rise 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .query {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 1.3rem;
      line-height: 1.5;
      color: var(--ink);
      padding-left: 1rem;
      border-left: 3px solid var(--accent);
      margin-bottom: 1.1rem;
    }
    .query::before {
      content: "问";
      font-family: var(--display);
      font-style: italic;
      font-size: 0.85rem;
      color: var(--accent);
      margin-right: 0.6rem;
      vertical-align: 0.1em;
    }

    .answer { max-width: var(--measure); }
    .answer-text {
      word-break: break-word;
      color: var(--ink);
      font-size: 1.02rem;
      line-height: 1.8;
    }

    /* 渲染后的 Markdown 元素，统一成"书卷"排版（不再暴露 ** # - 等符号） */
    .answer-text > :first-child { margin-top: 0; }
    .answer-text > :last-child  { margin-bottom: 0; }
    .answer-text p { margin: 0 0 0.9rem; }
    .answer-text h1, .answer-text h2, .answer-text h3,
    .answer-text h4, .answer-text h5, .answer-text h6 {
      font-family: var(--serif);
      font-weight: 600;
      line-height: 1.4;
      color: var(--ink);
      margin: 1.4rem 0 0.7rem;
    }
    .answer-text h1 { font-size: 1.5rem; }
    .answer-text h2 { font-size: 1.32rem; }
    .answer-text h3 { font-size: 1.18rem; }
    .answer-text h4, .answer-text h5, .answer-text h6 { font-size: 1.05rem; }
    .answer-text ul, .answer-text ol { margin: 0 0 0.9rem; padding-left: 1.4rem; }
    .answer-text li { margin: 0.3rem 0; }
    .answer-text ul ul, .answer-text ol ol,
    .answer-text ul ol, .answer-text ol ul { margin: 0.3rem 0; }
    .answer-text strong { font-weight: 600; }
    .answer-text em { font-style: italic; }
    .answer-text a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .answer-text code {
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.9em;
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 5px;
      padding: 0.1em 0.4em;
    }
    .answer-text pre {
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 10px;
      padding: 0.9rem 1rem;
      overflow-x: auto;
      margin: 0 0 0.9rem;
    }
    .answer-text pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.88em;
    }
    .answer-text blockquote {
      margin: 0 0 0.9rem;
      padding: 0.2rem 0 0.2rem 1rem;
      border-left: 3px solid var(--accent);
      color: var(--ink-soft);
      font-style: italic;
    }
    .answer-text hr { border: none; border-top: 1px solid var(--rule); margin: 1.3rem 0; }
    .answer-text table {
      width: 100%;
      border-collapse: collapse;
      margin: 0 0 0.9rem;
      font-size: 0.95rem;
    }
    .answer-text th, .answer-text td {
      border: 1px solid var(--rule);
      padding: 0.45rem 0.7rem;
      text-align: left;
    }
    .answer-text th { background: var(--surface); font-weight: 600; }
    .answer-text del, .answer-text s { text-decoration: none; }

    .status {
      color: var(--ink-faint);
      font-size: 0.9rem;
      font-style: italic;
    }

    .caret {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      background: var(--accent);
      margin-left: 1px;
      vertical-align: -0.15em;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ── 空状态：引导提问 ── */
    .intro { max-width: var(--measure); }
    .intro p { color: var(--ink-soft); margin-bottom: 1.2rem; }
    .suggest {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .suggest button {
      font-family: var(--sans);
      font-size: 0.9rem;
      color: var(--ink-soft);
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: 999px;
      padding: 0.5rem 1rem;
      cursor: pointer;
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .suggest button:hover {
      color: var(--accent);
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* ── 输入栏 ── */
    .composer {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: color-mix(in oklch, var(--paper) 88%, transparent);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--rule);
    }
    .composer-inner {
      max-width: 760px;
      margin: 0 auto;
      padding: 1rem clamp(1.25rem, 5vw, 2.5rem);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .composer input {
      flex: 1;
      font-family: var(--sans);
      font-size: 1rem;
      color: var(--ink);
      background: transparent;
      border: none;
      border-bottom: 1.5px solid var(--rule);
      padding: 0.55rem 0.25rem;
      outline: none;
      transition: border-color 0.2s ease;
    }
    .composer input::placeholder { color: var(--ink-faint); }
    .composer input:focus { border-color: var(--accent); }
    .composer button {
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--paper);
      background: var(--accent);
      border: none;
      border-radius: 999px;
      padding: 0.6rem 1.5rem;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }
    .composer button:hover { transform: translateY(-1px); }
    .composer button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    @media (max-width: 540px) {
      .query { font-size: 1.15rem; }
      .masthead-actions { position: static; display: flex; margin-top: 1rem; }
      .masthead { padding-bottom: 1.2rem; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="kicker">智能问答助手</div>
      <h1>有什么可以帮您？</h1>
      <p class="lede">基于公司制度手册，为您解答考勤、请假、福利等相关问题。</p>
      <div class="masthead-actions">
        <button class="theme-toggle" id="resetBtn">新对话</button>
        <button class="theme-toggle" id="themeToggle">深色模式</button>
      </div>
    </header>

    <section id="conversation">
      <div class="intro" id="intro">
        <p>试着问点什么：</p>
        <div class="suggest">
          <button>年假有多少天</button>
          <button>病假工资怎么算</button>
          <button>请假审批流程是什么</button>
        </div>
      </div>
    </section>
  </main>

  <form class="composer" id="composer">
    <div class="composer-inner">
      <input id="input" type="text" placeholder="输入你的问题，回车发送" autocomplete="off" aria-label="问题输入框" />
      <button type="submit" id="send">询问</button>
    </div>
  </form>

  <script src="vendor/purify.min.js"></script>
  <script type="module">
    import { marked } from './vendor/marked.esm.js';
    // 单换行即换行（breaks），兼容 GitHub 风格表格/列表（gfm）
    marked.setOptions({ breaks: true, gfm: true });

    const conversation = document.getElementById('conversation');
    const intro = document.getElementById('intro');
    const form = document.getElementById('composer');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    // 主题切换（记忆到 localStorage）
    const themeToggle = document.getElementById('themeToggle');
    const root = document.documentElement;
    function applyTheme(t) {
      root.setAttribute('data-theme', t);
      themeToggle.textContent = t === 'dark' ? '浅色模式' : '深色模式';
      try { localStorage.setItem('rag-theme', t); } catch (e) {}
    }
    applyTheme(localStorage.getItem('rag-theme') || 'light');
    themeToggle.addEventListener('click', () => {
      applyTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
    });

    // 会话 ID：每标签页独立（sessionStorage），解决多设备/多用户对话串台
    let sessionId = sessionStorage.getItem('rag-session');
    if (!sessionId) {
      sessionId = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { sessionStorage.setItem('rag-session', sessionId); } catch (e) {}
    }

    // 新对话：轮换会话 ID（旧会话在后端被孤立弃用，不会污染新会话），刷新界面
    // 说明：Vercel 上 api/rag.js 与 api/reset.js 是独立函数、内存不共享，
    // 因此"重置"只能在客户端轮换 sid 实现，而非跨函数清内存。
    const resetBtn = document.getElementById('resetBtn');
    resetBtn.addEventListener('click', () => {
      sessionId = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
      try { sessionStorage.setItem('rag-session', sessionId); } catch (e) {}
      location.reload();
    });

    // 创建一个问答段落，返回需要更新的节点
    function createExchange(question) {
      const section = document.createElement('section');
      section.className = 'exchange';

      const q = document.createElement('div');
      q.className = 'query';
      q.textContent = question;

      const answer = document.createElement('div');
      answer.className = 'answer';

      const status = document.createElement('div');
      status.className = 'status';
      status.textContent = '正在检索资料…';

      const answerText = document.createElement('p');
      answerText.className = 'answer-text';
      const caret = document.createElement('span');
      caret.className = 'caret';
      answerText.appendChild(caret);

      answer.appendChild(status);
      answer.appendChild(answerText);
      section.appendChild(q);
      section.appendChild(answer);
      conversation.appendChild(section);

      return { answer, answerText, caret, status, md: '' };
    }

    let streaming = false;

    function ask(question) {
      question = (question || '').trim();
      if (!question || streaming) return;

      if (intro) { intro.remove(); }

      streaming = true;
      send.disabled = true;
      input.value = '';
      input.blur();

      const node = createExchange(question);
      conversation.scrollIntoView({ behavior: 'smooth', block: 'end' });

      const evtSource = new EventSource(`/ai/rag/stream?question=${encodeURIComponent(question)}&sid=${encodeURIComponent(sessionId)}`);

      evtSource.onmessage = (e) => {
        if (e.data === '[DONE]') {
          evtSource.close();
          finish();
          return;
        }
        try {
          const obj = JSON.parse(e.data);
          if (obj.type === 'status') {
            // 状态消息（如"正在初始化知识库…"）：只更新状态栏，不混入答案
            if (node.status) {
              node.status.textContent = obj.content;
            }
            return;
          }
          if (obj.type === 'content') {
            // 首字到达：移除"检索中"状态
            if (node.status && node.status.parentNode) {
              node.status.remove();
              node.status = null;
            }
            // 累加成完整 Markdown，每收到一块就重新渲染（打字机过程中符号会随补全自动"成版"）
            node.md += obj.content;
            node.answerText.innerHTML = DOMPurify.sanitize(marked.parse(node.md));
            node.answerText.appendChild(node.caret);
            conversation.scrollIntoView({ behavior: 'smooth', block: 'end' });
          }
          // sources 事件不再渲染（用户不需要看来源/相似度）
        } catch (err) { /* 忽略偶发解析错误 */ }
      };

      evtSource.onerror = () => { evtSource.close(); finish(); };

      function finish() {
        if (node.caret && node.caret.parentNode) node.caret.remove();
        if (node.status && node.status.parentNode) {
          node.status.textContent = '（未检索到相关段落）';
        }
        streaming = false;
        send.disabled = false;
        input.focus();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      ask(input.value);
    });

    document.querySelectorAll('.suggest button').forEach((btn) => {
      btn.addEventListener('click', () => ask(btn.textContent));
    });
  </script>
</body>
</html>
