# Render 声明式部署配置（Blueprint）
# 在 Render 控制台 New → Blueprint 选择本仓库即可自动读取此文件。
# 安全：DASHSCOPE_API_KEY 用 sync: false，由你在 Render 后台手动填入，绝不进仓库。

services:
  - type: web
    name: rag-demo
    runtime: node
    plan: free
    region: oregon          # 免费层可选；国内访问略慢但能跑
    branch: main
    buildCommand: npm install
    startCommand: node rag-advanced.js
    envVars:
      - key: DASHSCOPE_API_KEY
        sync: false
      - key: NODE_ENV
        value: production
